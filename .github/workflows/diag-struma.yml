name: diag-struma
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-struma.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nominatim — автогари и АМ Люлин
        continue-on-error: true
        run: |
          : > struma-diag.txt
          UA="BAK-diag/1.0 (github.com/emillion-lab/BAK)"
          for Q in "Автогара Овча купел, София" "Автогара Запад, София" "Централна автогара, София" "автомагистрала Люлин, София" "Люлин motorway Sofia" "Овча купел bus station Sofia"; do
            echo "== $Q" >> struma-diag.txt
            curl -s -m 30 -A "$UA" -G "https://nominatim.openstreetmap.org/search" \
              --data-urlencode "q=$Q" --data-urlencode "format=jsonv2" --data-urlencode "limit=5" -o r.json || true
            python3 -c "
          import json
          try:
              for e in json.load(open('r.json')):
                  print('  ', e.get('lat'), e.get('lon'), '|', e.get('category'), e.get('type'), '|', e.get('display_name','')[:140])
          except Exception as x:
              print('  ERR', x, open('r.json').read()[:200])
          " >> struma-diag.txt
            sleep 2
          done
          cat struma-diag.txt
      - name: Commit
        run: |
          git config user.name ui-bot; git config user.email ui-bot@bak
          touch struma-diag.txt
          git add struma-diag.txt
          git diff --cached --quiet || (git commit -m "diag: Струма — Nominatim" && git push)
