name: patch-v3-design
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-v3-design.yml'
      - 'scripts/patch_v3_design.py'

permissions:
  contents: write

concurrency:
  group: patch-v3-design
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Провери новите файлове
        run: |
          test -f bak-v3.css && test -f bak-guard.js
          node --check bak-guard.js && node --check access-gate.js && echo "JS OK"

      - name: Закачи дизайна и пазача в index.html
        run: python3 scripts/patch_v3_design.py

      - name: Провери index.html
        run: |
          grep -q 'bak-guard.js?v=1' index.html
          grep -q 'bak-v3.css?v=1' index.html
          grep -q 'access-gate.js?v=3' index.html
          grep -q "src=\"app.js" index.html
          python3 - <<'PY'
          h=open('index.html',encoding='utf-8').read()
          assert h.index('bak-guard.js') < h.index('src="app.js'), 'guard after app.js'
          assert h.count('<style>')==h.count('</style>')
          print('index.html OK')
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "няма промяна"
            exit 0
          fi
          git commit -m "BAK: дизайн v3 + пазач за демо (index.html, sw.js)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash || true
            if git push; then
              echo "качено от опит $i"
              exit 0
            fi
            sleep $((i * 6))
          done
          exit 1
