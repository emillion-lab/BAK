name: FAB Test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install puppeteer@22 --no-save 2>&1 | tail -1
      - run: |
          cat > ft.mjs << 'JS'
          import puppeteer from 'puppeteer';
          const b = await puppeteer.launch({args:['--no-sandbox']});
          const p = await b.newPage();
          await p.setViewport({width:390,height:844});
          const errs=[]; p.on('pageerror',e=>errs.push(String(e.message||e)));
          await p.goto('https://emillion-lab.github.io/BAK/?fab='+Date.now(), {waitUntil:'networkidle2', timeout:45000});
          await new Promise(r=>setTimeout(r,7000));
          const before = await p.evaluate(() => ({
            hub: !!document.getElementById('fab-hub'),
            sats: [...document.querySelectorAll('#fab-wrap .fab-sat')].map(e=>e.id),
            karakListBtn: !!document.getElementById('toggle-map-btn-k'),
            strayFixed: [...document.querySelectorAll('#gps-btn,#fs-btn,#bakshish-btn,#next90-btn,#karyk-btn')]
              .filter(e=>!e.closest('#fab-wrap')).map(e=>e.id)
          }));
          await p.click('#fab-hub');
          await new Promise(r=>setTimeout(r,700));
          const after = await p.evaluate(() => {
            const hubR = document.getElementById('fab-hub').getBoundingClientRect();
            const hubC = {x:hubR.x+hubR.width/2, y:hubR.y+hubR.height/2};
            const sats = [...document.querySelectorAll('#fab-wrap .fab-sat')].map(e=>{
              const r = e.getBoundingClientRect();
              const c = {x:r.x+r.width/2, y:r.y+r.height/2};
              return { id:e.id, w:Math.round(r.width), h:Math.round(r.height),
                dist: Math.round(Math.hypot(c.x-hubC.x, c.y-hubC.y)),
                onScreen: r.x>=0 && r.y>=0 && r.right<=innerWidth && r.bottom<=innerHeight,
                // кой елемент реално получава допира в центъра на бутона
                hit: (document.elementFromPoint(c.x,c.y)||{}).id || '?' };
            });
            const labs = [...document.querySelectorAll('.fab-label')].map(e=>{
              const r=e.getBoundingClientRect();
              return { t:e.textContent.trim(), y:Math.round(r.y), h:Math.round(r.height),
                       fits: r.x>=0 && r.right<=innerWidth };
            }).sort((a,b)=>a.y-b.y);
            const cs = [...document.querySelectorAll('#fab-wrap .fab-sat')].map(e=>{
              const r=e.getBoundingClientRect(); return {x:r.x+r.width/2, y:r.y+r.height/2, w:r.width};
            }).sort((a,b)=>a.y-b.y);
            let minAdjacent = 9999, size = cs.length?Math.round(cs[0].w):0;
            for(let i=1;i<cs.length;i++)
              minAdjacent = Math.min(minAdjacent, Math.round(Math.hypot(cs[i].x-cs[i-1].x, cs[i].y-cs[i-1].y)));
            let overlaps=0;
            for(let i=1;i<labs.length;i++) if(labs[i].y < labs[i-1].y+labs[i-1].h) overlaps++;
            // подравняване: центърът на всеки надпис спрямо центъра на неговия бутон
            const align = [...document.querySelectorAll('.fab-label')].map(l=>{
              const b = document.getElementById(l.getAttribute('data-for'));
              if(!b) return null;
              const lr = l.getBoundingClientRect(), br = b.getBoundingClientRect();
              return { id:l.getAttribute('data-for'),
                       dy: Math.round((lr.y+lr.height/2) - (br.y+br.height/2)),
                       gap: Math.round(br.x - lr.right) };
            }).filter(Boolean);
            // карък: включваме и мерим индикацията
            const kb = document.getElementById('karyk-btn'); if(kb) kb.click();
            const karyk = {
              active: document.body.classList.contains('karyk-active'),
              badge: (()=>{const b=document.getElementById('karyk-badge');
                        return b ? getComputedStyle(b).display : 'липсва';})(),
              mapFilter: (()=>{const m=document.getElementById('map');
                        return m ? getComputedStyle(m).filter.slice(0,42) : '?';})(),
              frame: (()=>{const s=getComputedStyle(document.body,'::after');
                        return s.borderTopWidth+'/'+s.borderRightWidth+'/'+s.borderBottomWidth+'/'+s.borderLeftWidth
                               +' anim='+s.animationName+' inset='+s.inset;})(),
              corners: ['karyk-corner-tr','karyk-corner-bl'].filter(id=>{
                        const e=document.getElementById(id);
                        return e && getComputedStyle(e).display!=='none';}).length + 2,
              pulse: (()=>{const s=getComputedStyle(document.body,'::after');
                        return s.animationName||'няма';})()
            };
            if(kb) kb.click();
            return {
              karyk,
              layout: (()=>{
                const st=document.getElementById('topstack'), mp=document.getElementById('map');
                if(!st||!mp) return 'липсва stage';
                const s=st.getBoundingClientRect(), m=mp.getBoundingClientRect();
                return { stackH:Math.round(s.height), mapH:Math.round(m.height),
                         mapUnderStack: Math.round(m.top) <= Math.round(s.top)+2,
                         stackVar:getComputedStyle(document.documentElement).getPropertyValue('--stack-h').trim() };})(),
              darkInLight: (()=>{
                document.body.classList.remove('theme-night'); document.body.classList.add('theme-day');
                const bad=[];
                ['#fab-hub','.fab-label','#weather-bar','.ticker-bar','.header'].forEach(sel=>{
                  const e=document.querySelector(sel); if(!e) return;
                  const bg=getComputedStyle(e).backgroundColor;
                  const m=bg.match(/(\d+),\s*(\d+),\s*(\d+)/);
                  if(m){ const lum=(+m[1]*0.299 + +m[2]*0.587 + +m[3]*0.114);
                         if(lum < 110) bad.push(sel+' '+bg); }
                });
                return bad;})(), minAdjacent, size,
              align,
              neighbours: minAdjacent,
              satSize: cs.length?Math.round(cs[0].w):0,
              links: document.querySelectorAll('#fab-rays line.fab-link').length,
              ticker: (document.getElementById('ticker')||{}).textContent||'',
              n90: (()=>{const b=document.getElementById('next90-btn'); if(b) b.click();
                        const t=(document.getElementById('next90-list')||{}).textContent||'';
                        if(b) b.click(); return t.replace(/\s+/g,' ').slice(0,150);})(),
              topHint: (document.getElementById('tl-hint')||{}).textContent,
              topRot: (window.__topRot||[]).slice(0,3),
              flights: (()=>{
                if(typeof showAirportSchedule!=='function') return 'функцията не е глобална!';
                showAirportSchedule();
                const txt=document.body.innerText||'';
                const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
                // всички часове, показани в панела
                const times=[...txt.matchAll(/(\d{2}):(\d{2})–(\d{2}):(\d{2})/g)]
                  .map(m=>({from:+m[1]*60 + +m[2], to:+m[3]*60 + +m[4]}));
                const past=times.filter(t=>t.to < nowMin-20).length;
                return {redove:times.length, minali:past, chas:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0')};
              })(),
              bakshishRows: (()=>{const b=document.getElementById('bakshish-btn');
                        if(b) b.click();
                        const it=document.querySelector('#bakshish-list .bp-item');
                        const h=it?Math.round(it.getBoundingClientRect().height):0;
                        const why=document.querySelectorAll('#bakshish-list .bp-why').length;
                        if(b) b.click();
                        return {height:h, whyLines:why};})(),
              open: document.body.classList.contains('fab-open'),
              rays: document.querySelectorAll('#fab-rays line').length,
              hubCovered: (document.elementFromPoint(hubC.x,hubC.y)||{}).id,
              sats, labelOverlaps: overlaps,
              labels: labs.map(l=>l.t+(l.fits?'':' [ИЗЛИЗА ОТ ЕКРАНА]'))
            };
          });
          console.log('BEFORE:', JSON.stringify(before,null,1));
          console.log('AFTER OPEN:', JSON.stringify(after,null,1));
          console.log('PAGEERRORS:', errs.slice(0,4).join(' | ') || 'none');
          await b.close();
          JS
          node ft.mjs > fab-report.txt 2>&1 || true
          git config user.name ci; git config user.email ci@fish.taxi
          git add fab-report.txt && git commit -m "fab test [skip ci]" || true
          git push
