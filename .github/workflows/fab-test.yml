name: FAB Test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install puppeteer@22 --no-save 2>&1 | tail -1
      - run: |
          cat > ft.mjs << 'JS'
          import puppeteer from 'puppeteer';
          const b = await puppeteer.launch({args:['--no-sandbox']});
          const p = await b.newPage();
          await p.setViewport({width:390,height:844});
          const errs=[]; p.on('pageerror',e=>errs.push(String(e.message||e)));
          const failed=[]; p.on('requestfailed',r=>{ if(/tile|\.png/.test(r.url())) failed.push(r.url().slice(0,60)); });
          await p.goto('https://emillion-lab.github.io/BAK/?t='+Date.now(), {waitUntil:'networkidle2', timeout:45000});
          await new Promise(r=>setTimeout(r,8000));
          const out = await p.evaluate(() => {
            const ids=['next90-btn','clean-btn','gps-btn','fs-btn',
                       'dest-airport','dest-cjp','dest-cab_north','dest-cas_intl','dest-__zones'];
            const boxes = ids.map(id=>{const e=document.getElementById(id);
              return e?{id, r:e.getBoundingClientRect()}:null;}).filter(Boolean);
            let overlaps=[], offscreen=[];
            for(let i=0;i<boxes.length;i++){
              const r=boxes[i].r;
              if(r.right>innerWidth+1 || r.bottom>innerHeight+1 || r.top<0) offscreen.push(boxes[i].id);
              for(let j=i+1;j<boxes.length;j++){
                const a=r,c=boxes[j].r;
                if(a.left<c.right&&c.left<a.right&&a.top<c.bottom&&c.top<a.bottom)
                  overlaps.push(boxes[i].id+'×'+boxes[j].id);
              }
            }
            // тъмни повърхности в дневната тема
            document.body.classList.remove('theme-night'); document.body.classList.add('theme-day');
            const dark=[];
            ['#next90-panel','#exit-now-panel','#dest-airport','.ticker-bar','#weather-bar'].forEach(sel=>{
              const e=document.querySelector(sel); if(!e) return;
              const m=getComputedStyle(e).backgroundColor.match(/(\d+),\s*(\d+),\s*(\d+)/);
              if(m && (+m[1]*.299 + +m[2]*.587 + +m[3]*.114) < 110) dark.push(sel);
            });
            // всеки бутон: отваря ли, пълни ли екрана, затваря ли се с втори клик
            const opens={};
            ['dest-__zones','dest-airport','dest-cjp','dest-cab_north','dest-cas_intl'].forEach(id=>{
              const e=document.getElementById(id); if(!e) return;
              e.click();
              const full = id==='dest-__zones'
                ? document.body.classList.contains('full-list')
                : (document.body.getAttribute('data-full')===id.replace('dest-',''));
              let visible=false, h=0;
              if(id==='dest-__zones'){ const s=document.getElementById('zone-sidebar');
                if(s){ const r=s.getBoundingClientRect(); visible=r.height>100 && r.top<innerHeight; h=Math.round(r.height);} }
              else if(id==='dest-airport'){ const m=document.getElementById('airport-modal');
                visible = m && getComputedStyle(m).display!=='none'; }
              else { visible = !!document.querySelector('.leaflet-popup'); }
              e.click();
              const closed = !document.body.getAttribute('data-full');
              opens[id]={opened:full, visible, h, closedOnSecond:closed};
            });
            // може ли страницата да се дърпа под картата
            const scrollable = document.documentElement.scrollHeight > innerHeight + 4;
            const mp=document.getElementById('map'), st=document.getElementById('topstack');
            return {
              found: boxes.map(x=>x.id), missing: ids.filter(i=>!boxes.find(x=>x.id===i)),
              overlaps, offscreen, dark, opens, scrollable,
              mapH: mp?Math.round(mp.getBoundingClientRect().height):0,
              mapBottom: mp?Math.round(mp.getBoundingClientRect().bottom):0,
              stackH: st?Math.round(st.getBoundingClientRect().height):0,
              viewport: innerHeight,
              fanGone: !document.querySelector('#fab-hub:not([style*="display: none"])')
            };
          });
          console.log('RESULT:', JSON.stringify(out,null,1));
          console.log('TILEFAILS:', failed.length);
          console.log('PAGEERRORS:', errs.slice(0,4).join(' | ')||'none');
          await b.close();
          JS
          node ft.mjs > fab-report.txt 2>&1 || true
          git config user.name ci; git config user.email ci@fish.taxi
          git add fab-report.txt && git commit -m "test [skip ci]" || true
          git push
