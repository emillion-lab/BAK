<!doctype html>
<html lang="bg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1012">
<title>Моят профил — BAK</title>
<script>
/* само за влезли в BAK (същият код като в BAK) */
try{if(!localStorage.getItem('bak_access'))document.documentElement.className='nologin';}catch(e){}
</script>
<style>
/* BAK · настройки на шофьора (преместени от fish.taxi, 12.11.2026). Стил fish.taxi v3. */
:root{color-scheme:dark;--bg:#0e1012;--tx:#eef0ee;--mu:#a3abb1;--ac:#e6c36a;--ln:rgba(255,255,255,.12);--gl:rgba(255,255,255,.05);
 --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;background:radial-gradient(120% 60% at 50% 0%,#1a1e22 0%,#0e1012 60%) fixed;color:var(--tx);font:16px/1.4 var(--f);letter-spacing:-.01em;
 -webkit-font-smoothing:antialiased;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:540px;min-height:100vh}
.top{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(24,28,32,.4);border:1px solid var(--ln);
 color:var(--tx);text-decoration:none;font-size:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h1{font-size:22px;font-weight:700;margin:0}
h2{font-size:12.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:22px 4px 8px}
.card{background:var(--gl);border:1px solid var(--ln);border-radius:20px;padding:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
 animation:up .45s cubic-bezier(.2,.9,.25,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
input{width:100%;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--ln);background:rgba(0,0,0,.28);color:var(--tx);font:16px var(--f);margin:6px 0 8px;outline:0}
input:focus{border-color:rgba(230,195,106,.6)}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.5,.5,1),background .2s,border-color .2s}
button:active{transform:scale(.95)}
.go{width:100%;height:50px;border-radius:14px;background:rgba(230,195,106,.18);border:1px solid rgba(230,195,106,.55);color:var(--ac);font-weight:700;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 15px;border-radius:999px;background:var(--gl);border:1px solid var(--ln);font-size:15px}
.chip.on{background:rgba(230,195,106,.2);border-color:rgba(230,195,106,.6);color:var(--ac);font-weight:600}
.chip.ask{background:rgba(134,211,164,.16);border-color:rgba(134,211,164,.55);color:#86d3a4;font-weight:600}
.hint{color:var(--mu);font-size:14px;margin:4px 2px}
.msg{margin-top:10px;font-size:14px;min-height:1.2em}.err{color:#ef8f86}.ok{color:#86d3a4}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-child{border-bottom:0}
.row b{font-weight:500}
#ed{display:none}
#tri{background:var(--gl);border:1px solid var(--ln);border-radius:20px;padding:4px 14px}
#save{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.nl{display:none;text-align:center;margin-top:18vh}
.nl .lk{width:58px;height:58px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:rgba(230,195,106,.14);border:1px solid rgba(230,195,106,.4)}
.nl a{display:block;text-decoration:none;text-align:center;line-height:50px}
html.nologin .nl{display:block}html.nologin #login,html.nologin #ed{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="top"><a class="back" href="./" aria-label="Към BAK">‹</a><h1>Моят профил</h1></div>
<div class="card nl"><div class="lk">🔒</div><h1 style="font-size:19px">Не си влязъл</h1>
  <p class="hint" style="margin:8px 0 6px">Настройките на шофьора са в BAK. Първо влез в BAK с кода си.</p>
  <a class="go" href="./">Към BAK</a></div>
<div class="card" id="login">
  <div class="hint">Влез със същите телефон и код като в апа за GPS.</div>
  <input id="ph" inputmode="tel" placeholder="Телефон, напр. 0889…" autocomplete="username">
  <input id="tk" type="password" placeholder="Код (token)" autocomplete="current-password">
  <button class="go" id="enter">Влез</button>
  <div class="msg err" id="lerr"></div>
</div>

<div id="ed">
  <div class="hint" id="who"></div>
  <h2>В колата</h2><div class="chips" data-g="b"></div>
  <h2>Музика</h2><div class="chips" data-g="m"></div>
  <h2>Езици</h2><div class="chips" data-g="l"></div>
  <h2>Какво приемаш</h2><div id="tri"></div>
  <div class="hint">Зелено = „по договаряне“. Име, снимки, кола, тарифа и описание ги сменя Емил — пиши му във Viber.</div>
  <button class="go" id="save">Запази</button>
  <div class="msg" id="smsg"></div>
</div>

<script>
var API='https://mvr-proxy.mihov-emil.workers.dev/driver/profile';
var B=[['ac','Климатик'],['usb','USB зарядно'],['streaming','Стрийминг'],['petfriendly','Домашни любимци'],['childok','Детско столче'],['nosmoker','Непушач'],['terminal','Терминал'],['talk_ok','Приказлив'],['silent_ok','Тих/мълчалив'],['calm_ok','Спокойно каране']];
var M=[['music','Музика'],['music_pop','Поп'],['music_chalga','Чалга'],['music_rock','Рок'],['music_classical','Класика'],['music_jazz','Джаз'],['music_electronic','Електронна'],['music_chillout','Чилаут'],['music_lounge','Лаунж']];
var L=[['bg','Български'],['en','Английски'],['ru','Руски'],['de','Немски'],['fr','Френски'],['tr','Турски'],['it','Италиански'],['es','Испански'],['cs','Чешки'],['ar','Арабски'],['zh','Китайски']];
var T=[['airport','Летище'],['longdist','Дълги курсове'],['night','Нощем'],['wheelchair','Инвалидна количка']];
var S={},LG=[],cur=null,orig={};
function $(i){return document.getElementById(i)}
function norm(p){var d=String(p||'').replace(/\D/g,'');if(d.indexOf('00')==0)d=d.slice(2);if(d.charAt(0)=='0')d='359'+d.slice(1);return d}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function chips(sel,arr,isLang){var box=document.querySelector('[data-g="'+sel+'"]');box.innerHTML='';
 arr.forEach(function(x){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=x[1];
  function on(){return isLang?LG.indexOf(x[0])>=0:S[x[0]]===true}
  function paint(){b.classList.toggle('on',on())}
  b.onclick=function(){if(isLang){var i=LG.indexOf(x[0]);if(i>=0)LG.splice(i,1);else LG.push(x[0])}else S[x[0]]=!(S[x[0]]===true);paint()};
  paint();box.appendChild(b)})}
function tri(){var t=$('tri');t.innerHTML='';T.forEach(function(x){var r=document.createElement('div');r.className='row';r.innerHTML='<b>'+x[1]+'</b><span class="chips"></span>';
 var c=r.querySelector('.chips');[[true,'да'],[false,'не'],['ask','по договаряне']].forEach(function(o){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=o[1];
  function paint(){b.classList.toggle('on',S[x[0]]===o[0]&&o[0]!=='ask');b.classList.toggle('ask',S[x[0]]===o[0]&&o[0]==='ask')}
  b.onclick=function(){S[x[0]]=o[0];[].forEach.call(c.children,function(z){z.classList.remove('on','ask')});paint()};paint();c.appendChild(b)});t.appendChild(r)})}
$('enter').onclick=function(){
 $('lerr').textContent='';var ph=norm($('ph').value),tk=$('tk').value.trim();
 if(ph.length<11||!tk){$('lerr').textContent='Попълни телефон и код.';return}
 fetch('https://fish.taxi/data/drivers.json?'+Date.now()).then(function(r){return r.json()}).then(function(a){
  var d=a.filter(function(x){return String(x.gps_id)===ph})[0];
  if(!d){$('lerr').textContent='Няма публикуван профил за този телефон.';return}
  // кодът се проверява при „Запази“; тук само показваме профила
  cur={ph:ph,tk:tk};save('pp_ph',$('ph').value);save('pp_tk',tk);
  S={};orig={};B.concat(M,T).forEach(function(x){S[x[0]]=d[x[0]]});LG=(d.langs||[]).slice();
  $('who').textContent=(d.name_bg||d.name)+' · '+(d.car||'');
  chips('b',B);chips('m',M);chips('l',L,true);tri();
  $('login').style.display='none';$('ed').style.display='block'
 }).catch(function(){$('lerr').textContent='Не успях да заредя профила. Опитай пак.'})};
$('save').onclick=function(){
 var m=$('smsg');m.className='msg';m.textContent='Записвам…';var f={};
 B.concat(M).forEach(function(x){f[x[0]]=S[x[0]]===true});T.forEach(function(x){if(S[x[0]]!==undefined)f[x[0]]=S[x[0]]});
 if(LG.length)f.langs=LG;else{m.className='msg err';m.textContent='Избери поне един език.';return}
 fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({driver_id:cur.ph,token:cur.tk,fields:f})})
 .then(function(r){return r.json().then(function(j){return{s:r.status,j:j}})}).then(function(o){
  if(o.s==401){m.className='msg err';m.textContent='Грешен код. Върни се и влез отново.'}
  else if(o.j&&o.j.ok){m.className='msg ok';m.textContent='Готово. Промяната се вижда на сайта до 2–3 минути.'}
  else{m.className='msg err';m.textContent=(o.j&&o.j.error)||'Не стана. Опитай след малко.'}
 }).catch(function(){m.className='msg err';m.textContent='Няма връзка. Опитай пак.'})};
$('ph').value=load('pp_ph');$('tk').value=load('pp_tk');
</script></body></html>
